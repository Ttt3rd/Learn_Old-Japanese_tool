<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#243b53">
<title>古文単語テスト予習</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#243247;background:#f3f6fa}
*{box-sizing:border-box}body{margin:0}header{background:#243b53;color:white;padding:20px max(18px,calc((100% - 1050px)/2))}
header h1{font-size:1.35rem;margin:0 0 5px}header p{margin:0;color:#dbe7f3;font-size:.9rem}
main{max-width:1050px;margin:20px auto;padding:0 14px 50px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
button,.tab{border:0;border-radius:9px;padding:10px 14px;font:inherit;cursor:pointer;background:#e1e8f0;color:#243247}
button.primary,.tab.active{background:#2764a5;color:white}button.danger{background:#fce5e5;color:#9b2525}button:disabled{opacity:.45;cursor:not-allowed}
.panel{background:white;border:1px solid #e1e7ee;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #19334b0a}
h2{font-size:1.12rem;margin:0 0 14px}h3{font-size:1rem;margin:18px 0 8px}
label{display:block;font-weight:650;font-size:.9rem;margin:12px 0 5px}
input,textarea,select{width:100%;padding:10px 11px;border:1px solid #cbd5df;border-radius:8px;font:inherit;background:white;color:#243247}
textarea{min-height:74px;resize:vertical}.hint,.muted{color:#64748b;font-size:.85rem}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meaning-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin:7px 0}
.meaning-row input[type=checkbox]{width:auto}.meaning-row label{margin:0;font-weight:500}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.unit-list,.word-list{display:grid;gap:8px}
.unit-item,.word-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid #e1e7ee;border-radius:9px}
.unit-item small,.word-item small{display:block;color:#64748b}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.stat{background:#eef4fa;border-radius:9px;padding:9px 13px}
.stat b{font-size:1.15rem;display:block}
.quiz-word{font-size:1.65rem;font-weight:750;text-align:center;margin:20px 0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.choice{background:#f3f6fa;border:1px solid #d6e0ea;text-align:left;min-height:48px}
.choice.correct{background:#e0f5e8;border-color:#29985a}.choice.wrong{background:#fde8e8;border-color:#d44}
.feedback{padding:13px;border-radius:9px;margin-top:12px;background:#eef4fa;line-height:1.65}
.feedback.good{background:#e4f6eb}.feedback.bad{background:#fff0e8}
.sentence{font-size:1.15rem;line-height:2.1;background:#f7f9fc;padding:14px;border-radius:9px}
.hidden{display:none!important}.pill{font-size:.78rem;background:#fff1cf;color:#815500;padding:3px 7px;border-radius:20px}
footer{text-align:center;color:#718096;font-size:.8rem;padding:12px}
@media(max-width:620px){.row{grid-template-columns:1fr}.choices{grid-template-columns:1fr}.panel{padding:14px}.meaning-row{grid-template-columns:1fr auto auto}}
</style>
</head>
<body>
<header><h1>古文単語テスト予習</h1><p>単元ごとに単語を登録して、意味と例文を繰り返し練習できます。</p></header>
<main>
<nav>
<button class="tab active" data-tab="study">問題を解く</button>
<button class="tab" data-tab="edit">単語を登録・編集</button>
<button class="tab" data-tab="review">苦手単語</button>
<button class="tab" data-tab="manage">単元・データ管理</button>
</nav>

<section id="study" class="view">
<div class="panel">
<h2>出題設定</h2>
<div class="row">
<div><label for="studyUnit">単元</label><select id="studyUnit"></select></div>
<div><label for="mode">問題形式</label><select id="mode"><option value="choice">単語のみ → 意味を5択</option><option value="sentence">例文 → 対象語句の意味を記述</option><option value="mixed">ランダム（両形式）</option></select></div>
</div>
<div class="actions"><button class="primary" id="startQuiz">この条件で出題開始</button><span class="hint" id="studyCount"></span></div>
</div>
<div class="panel hidden" id="quizPanel">
<div class="stats"><div class="stat">今回の問題<b id="qNumber">1</b></div><div class="stat">今回の正解<b id="qCorrect">0</b></div></div>
<div id="questionArea"></div>
<div id="feedback" class="feedback hidden"></div>
<div class="actions hidden" id="nextArea"><button class="primary" id="nextQuestion">次の問題</button><button id="endQuiz">終了</button></div>
</div>
</section>

<section id="edit" class="view hidden">
<div class="panel">
<h2>単語を登録・編集</h2>
<label for="editUnit">登録先の単元</label><select id="editUnit"></select>
<input type="hidden" id="wordId">
<div class="row">
<div><label for="kana">単語（ひらがな）</label><input id="kana" placeholder="例：あはれなり"></div>
<div><label for="kanji">単語（漢字）</label><input id="kanji" placeholder="例：哀れなり（任意）"></div>
</div>
<h3>意味（複数登録可能）</h3>
<p class="hint">「重要」にチェックした意味は、出題・解説で優先的に扱います。</p>
<div id="meanings"></div>
<div class="actions"><button id="addMeaning">＋ 意味を追加</button></div>
<label for="explanation">解説</label><textarea id="explanation" placeholder="語源、用法、覚え方など"></textarea>
<h3>例文</h3>
<label for="original">例文原文</label><textarea id="original" placeholder="例：あはれなることも多かり。"></textarea>
<label for="target">例文中の対象語句</label><input id="target" placeholder="例：あはれなる（活用形など、原文中の表記）">
<label for="translation">例文現代語訳</label><textarea id="translation" placeholder="例：しみじみと心を打つことも多い。"></textarea>
<label for="sentenceMeaning">例文問題で正解にする意味</label><select id="sentenceMeaning"><option value="">意味を登録すると選択できます</option></select>
<div class="actions"><button class="primary" id="saveWord">単語を保存</button><button id="clearForm">入力をクリア</button></div>
</div>
<div class="panel"><h2>登録済み単語</h2><div id="wordList" class="word-list"></div></div>
</section>

<section id="review" class="view hidden">
<div class="panel"><h2>苦手単語</h2><p class="hint">間違えた回数が多い順に表示します。正解すると間違い回数は減らさず、累計として記録します。</p><div id="reviewList" class="word-list"></div></div>
</section>

<section id="manage" class="view hidden">
<div class="panel"><h2>単元管理</h2><label for="newUnit">新しい単元名</label><div class="row"><input id="newUnit" placeholder="例：第1章・助動詞"><button class="primary" id="addUnit">単元を追加</button></div><div id="unitList" class="unit-list" style="margin-top:12px"></div></div>
<div class="panel"><h2>データのバックアップ</h2><p class="hint">データはこのブラウザー内に保存されます。端末変更やブラウザーのデータ削除に備えて、定期的に書き出してください。</p><div class="actions"><button class="primary" id="exportData">JSONを書き出す</button><button id="importButton">JSONを読み込む</button><input type="file" id="importFile" accept=".json,application/json" class="hidden"></div></div>
</section>
<footer>学習データは端末内（localStorage）に保存されます。</footer>
</main>
<script>
const KEY='kobun_vocab_tool_v1';
const $=id=>document.getElementById(id);
let db=loadDB(), quiz=[], qi=0, correct=0, current=null, answered=false;
function loadDB(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.units)&&Array.isArray(x.words))return x}catch(e){}return{units:['未分類'],words:[]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}
function uid(){return 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function activeUnit(){return $('studyUnit').value}
function wordsFor(unit){return db.words.filter(w=>w.unit===unit)}
function renderSelects(){['studyUnit','editUnit'].forEach(id=>{const el=$(id),old=el.value;el.innerHTML=db.units.map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join('');if(db.units.includes(old))el.value=old});updateCount();renderWordList();renderReview();renderUnits();renderMeaningSelect()}
function updateCount(){$('studyCount').textContent=`${wordsFor(activeUnit()).length}語 登録済み`}
function renderAll(){renderSelects()}
function addMeaningRow(value='',important=false){const wrap=document.createElement('div');wrap.className='meaning-row';wrap.innerHTML=`<input class="meaning-text" placeholder="意味を入力" value="${esc(value)}"><label><input type="checkbox" class="meaning-important" ${important?'checked':''}> 重要</label><button type="button" class="danger remove-meaning">削除</button>`;wrap.querySelector('.remove-meaning').onclick=()=>{wrap.remove();renderMeaningSelect()};wrap.querySelector('.meaning-text').oninput=renderMeaningSelect;wrap.querySelector('.meaning-important').onchange=renderMeaningSelect;$('meanings').appendChild(wrap);renderMeaningSelect()}
function getMeanings(){return [...document.querySelectorAll('.meaning-row')].map(r=>({text:r.querySelector('.meaning-text').value.trim(),important:r.querySelector('.meaning-important').checked})).filter(m=>m.text)}
function renderMeaningSelect(){const sel=$('sentenceMeaning'),old=sel.value,ms=getMeanings();sel.innerHTML='<option value="">選択してください</option>'+ms.map((m,i)=>`<option value="${i}">${esc(m.text)}${m.important?' ★':''}</option>`).join('');if(ms[Number(old)])sel.value=old}
function clearForm(){['wordId','kana','kanji','explanation','original','target','translation'].forEach(id=>$(id).value='');$('meanings').innerHTML='';addMeaningRow();$('sentenceMeaning').value='';$('saveWord').textContent='単語を保存'}
function editWord(id){const w=db.words.find(x=>x.id===id);if(!w)return;$('editUnit').value=w.unit;$('wordId').value=w.id;$('kana').value=w.kana;$('kanji').value=w.kanji||'';$('explanation').value=w.explanation||'';$('original').value=w.original||'';$('target').value=w.target||'';$('translation').value=w.translation||'';$('meanings').innerHTML='';w.meanings.forEach(m=>addMeaningRow(m.text,m.important));$('sentenceMeaning').value=String(w.sentenceMeaning??'');$('saveWord').textContent='変更を保存';showTab('edit');window.scrollTo(0,0)}
function renderWordList(){const list=$('wordList');if(!list)return;const arr=wordsFor($('editUnit').value||db.units[0]);list.innerHTML=arr.length?arr.map(w=>`<div class="word-item"><div><b>${esc(w.kana)}</b> ${w.kanji?`<small>${esc(w.kanji)}</small>`:''}<small>${esc(w.meanings.map(m=>m.text).join('／'))} ・ 間違い ${w.wrong||0}回</small></div><div class="actions"><button data-edit="${w.id}">編集</button><button class="danger" data-delete="${w.id}">削除</button></div></div>`).join(''):'<p class="muted">この単元にはまだ単語がありません。</p>';list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editWord(b.dataset.edit));list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('この単語を削除しますか？')){db.words=db.words.filter(w=>w.id!==b.dataset.delete);persist()}})}
function renderReview(){const list=$('reviewList');if(!list)return;const arr=[...db.words].filter(w=>(w.wrong||0)>0).sort((a,b)=>(b.wrong||0)-(a.wrong||0));list.innerHTML=arr.length?arr.map(w=>`<div class="word-item"><div><b>${esc(w.kana)}</b><small>${esc(w.unit)} ・ ${esc(w.meanings.map(m=>m.text).join('／'))}</small></div><span class="pill">間違い ${w.wrong}回</span></div>`).join(''):'<p class="muted">まだ間違えた単語はありません。</p>'}
function renderUnits(){const list=$('unitList');if(!list)return;list.innerHTML=db.units.map(u=>`<div class="unit-item"><div><b>${esc(u)}</b><small>${wordsFor(u).length}語</small></div><button class="danger" data-unit="${esc(u)}" ${db.units.length===1?'disabled':''}>単元を削除</button></div>`).join('');list.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{const u=b.dataset.unit;if(!confirm(`「${u}」と登録単語をすべて削除しますか？`))return;db.units=db.units.filter(x=>x!==u);db.words=db.words.filter(w=>w.unit!==u);persist()})}
function showTab(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden',v.id!==id));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));if(id==='edit')renderWordList();if(id==='review')renderReview()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$('addMeaning').onclick=()=>addMeaningRow();$('clearForm').onclick=clearForm;
$('editUnit').onchange=renderWordList;$('studyUnit').onchange=updateCount;
$('addUnit').onclick=()=>{const u=$('newUnit').value.trim();if(!u)return alert('単元名を入力してください。');if(db.units.includes(u))return alert('同じ名前の単元があります。');db.units.push(u);$('newUnit').value='';persist();$('editUnit').value=u;$('studyUnit').value=u};
$('saveWord').onclick=()=>{const unit=$('editUnit').value,kana=$('kana').value.trim(),meanings=getMeanings();if(!kana)return alert('ひらがなの単語を入力してください。');if(!meanings.length)return alert('意味を1つ以上入力してください。');let si=$('sentenceMeaning').value;const old=db.words.find(w=>w.id===$('wordId').value);const w={id:old?.id||uid(),unit,kana,kanji:$('kanji').value.trim(),meanings,explanation:$('explanation').value.trim(),original:$('original').value.trim(),target:$('target').value.trim(),translation:$('translation').value.trim(),sentenceMeaning:si===''?null:Number(si),wrong:old?.wrong||0,attempts:old?.attempts||0};if(old)db.words=db.words.map(x=>x.id===old.id?w:x);else db.words.push(w);persist();clearForm();alert('保存しました。')};
$('startQuiz').onclick=()=>{const arr=wordsFor(activeUnit()).filter(w=>w.meanings.length);if(!arr.length)return alert('この単元に出題できる単語がありません。');quiz=arr.map(w=>({...w})).sort(()=>Math.random()-.5);qi=0;correct=0;$('quizPanel').classList.remove('hidden');showQuestion();$('quizPanel').scrollIntoView({behavior:'smooth'})};
function showQuestion(){if(qi>=quiz.length){$('questionArea').innerHTML=`<h2>終了！</h2><p>全${quiz.length}問中 ${correct}問正解</p>`;$('feedback').classList.add('hidden');$('nextArea').classList.remove('hidden');$('nextQuestion').textContent='最初から解く';return}current=quiz[qi];answered=false;$('qNumber').textContent=`${qi+1} / ${quiz.length}`;$('qCorrect').textContent=correct;$('feedback').classList.add('hidden');$('nextArea').classList.add('hidden');const mode=$('mode').value==='mixed'?(Math.random()<.5?'choice':'sentence'):$('mode').value;if(mode==='sentence'&&current.original&&current.target&&current.sentenceMeaning!==null&&current.meanings[current.sentenceMeaning])showSentence();else showChoice()}
function showChoice(){const correctMeaning=current.meanings.find(m=>m.important)||current.meanings[0];let pool=db.words.flatMap(w=>w.meanings.map(m=>m.text)).filter(t=>t!==correctMeaning.text);pool=[...new Set(pool)].sort(()=>Math.random()-.5).slice(0,4);while(pool.length<4)pool.push(['正しい意味ではない','別の意味','誤った選択肢','関係のない意味'][pool.length]);const opts=[...pool,correctMeaning.text].sort(()=>Math.random()-.5);$('questionArea').innerHTML=`<div class="muted" style="text-align:center">次の古文単語の意味は？</div><div class="quiz-word">${esc(current.kana)}${current.kanji?` <small>（${esc(current.kanji)}）</small>`:''}</div><div class="choices">${opts.map((t,i)=>`<button class="choice" data-choice="${i}">${i+1}. ${esc(t)}</button>`).join('')}</div>`;[...$('questionArea').querySelectorAll('[data-choice]')].forEach(b=>b.onclick=()=>answerChoice(b,correctMeaning.text))}
function showSentence(){const target=current.target;let sentence=esc(current.original);const safe=esc(target);if(current.original.includes(target))sentence=sentence.replace(esc(target),`<u><b>${safe}</b></u>`);$('questionArea').innerHTML=`<div class="muted">傍線部の意味を答えよう。</div><div class="sentence">${sentence}</div><label for="writtenAnswer">対象語句の現代語訳</label><input id="writtenAnswer" placeholder="意味を入力"><p class="hint">答えを入力したら「答えを見る」を押してください。表記が完全一致しなくても自己判定できます。</p><div class="actions"><button class="primary" id="reveal">答えを見る</button></div>`;$('reveal').onclick=()=>{if(!$('writtenAnswer').value.trim())return alert('答えを入力してください。');const m=current.meanings[current.sentenceMeaning];$('writtenAnswer').disabled=true;gradeSentence(m.text)}}
function answerChoice(btn,correctText){if(answered)return;answered=true;const chosen=btn.textContent.replace(/^\d+\. /,'');const ok=chosen===correctText;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;const t=b.textContent.replace(/^\d+\. /,'');if(t===correctText)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});finishAnswer(ok,correctText)}
function gradeSentence(correctText){const given=$('writtenAnswer').value.trim();const ok=given===correctText;finishAnswer(ok,correctText,`あなたの解答：${esc(given)}<br>`)}
function finishAnswer(ok,answer,extra=''){answered=true;const w=db.words.find(x=>x.id===current.id);if(w){w.attempts=(w.attempts||0)+1;if(!ok)w.wrong=(w.wrong||0)+1;localStorage.setItem(KEY,JSON.stringify(db))}if(ok)correct++;$('qCorrect').textContent=correct;const meanings=current.meanings.map(m=>`${m.important?'★ ':''}${esc(m.text)}`).join('／');$('feedback').className='feedback '+(ok?'good':'bad');$('feedback').innerHTML=`<b>${ok?'正解！':'不正解'}</b><br>${extra}正解：${esc(answer)}<br>意味一覧：${meanings}${current.explanation?`<br><br><b>解説</b><br>${esc(current.explanation).replace(/\n/g,'<br>')}`:''}${current.original?`<br><br><b>例文</b><br>${esc(current.original)}<br>${esc(current.translation||'')}`:''}`;$('feedback').classList.remove('hidden');$('nextArea').classList.remove('hidden');$('nextQuestion').textContent=qi===quiz.length-1?'結果を見る':'次の問題'}
$('nextQuestion').onclick=()=>{if(qi>=quiz.length){qi=0;correct=0;quiz.sort(()=>Math.random()-.5)}else qi++;showQuestion()};$('endQuiz').onclick=()=>{$('quizPanel').classList.add('hidden')};
$('exportData').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kobun-tango-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x.units)||!Array.isArray(x.words))throw Error();if(!confirm('現在のデータを読み込んだデータで置き換えますか？'))return;db=x;persist();alert('読み込みました。')}catch(err){alert('読み込めませんでした。JSONファイルを確認してください。')}e.target.value=''};
renderAll();clearForm();
</script>
</body></html>
